  openapi/rics-digitalcommunity-api-openapi.json, openapi/rics-data-standard-3.3.3-schema.json,
  openapi/rics-azure-ad-b2c-openid-configuration.json, and RICS published standards pages
summary: >-
  RICS conforms to the specification standards it writes for the built environment and to the basic
  description standards its own vendors ship (OpenAPI 3.0.1 from Swashbuckle, JSON Schema draft-04
  and W3C XSD in the RDS, OIDC discovery from Azure AD B2C). It conforms to none of the API-industry
  standards a consumer would look for - no OAuth 2.0 on the API itself, no RFC 9457, no OData, no
  JSON:API, no pagination or idempotency convention, and - decisively for a property body - no RESO
  Data Dictionary or RESO Web API, because the United Kingdom has no MLS to certify against.
