source: openapi/rics-digitalcommunity-api-openapi.json
api: RICS DigitalCommunity API
summary: >-
  Fifty-two schemas describing a regulator's back office, not a property dataset. The graph has one
  hub - RegulationScheme, the licence a RICS-regulated firm holds - which fans out to its offices,
  member directors and principals, professional indemnity insurers, redress providers, surveying
  services and annual regulatory returns, and recurses into child schemes. Two smaller trees hang
  off it: subscriptions and their licensed users, and the quote/sales-order/payment chain that bills
  them. Profile (the individual member) and SurveyWriter (a survey-writing software licence) stand
  apart, joined to the rest only by contact identifiers. Roughly half the schemas are enum lookups -
  statuses, reasons and types - which is the shape of a regulation system.
entities:
- name: RegulationScheme
  role: hub - a firm's RICS regulation licence
  addressed_by: GET /api/Regulation/{schemeNumber}
  identifiers: [regulatedSchemeId, regulatedSchemeNumber]
  fields: 79
  notable_fields: [schemeLicenceType, schemeLicenceStatus, hasPii, clientMoneyType, gimaStatus, responsiblePrincipalId, renewalsDate, isSelfDeclaredAsVrsEligible, createdOn, modifiedOn]
- name: Office
  role: a regulated firm's office/premises
  identifiers: [accountId, firmNumber, officeNumber]
  notable_fields: [registeredName, tradingName, vatRegNumber, isHeadOffice, isRegulated, hasActiveRegistration]
- name: PiiInsurer
  role: professional indemnity insurance declaration
- name: RedressProvider
  role: consumer redress scheme declaration
- name: MemberDirectorPrincipal
  role: the members who are directors or principals of the regulated firm
- name: SurveyingService
  role: the surveying services the scheme is licensed for
- name: RegulationReturn
  role: annual regulatory return submitted against a scheme
  identifiers: [regulatoryReturnId]
  notable_fields: [returnDueDate, dateOfSubmission, totalAnswersRequired, totalAnswersProvided, score, result, statusCode]
- name: RegulationSubscriptions
  role: collection wrapper
  addressed_by: GET /api/Regulation/Subscriptions
  notable_fields: [subscriptions, countOfSubscriptions]
- name: RegulationSubscription
  role: a subscription owned by a contact or account, optionally tied to a regulated scheme
  identifiers: [subscriptionNumber, ownerId, contactId]
  notable_fields: [numberOfLicences, startDate, endDate, status, paymentMethod, sponsorshipCode, renewalGuid]
- name: Subscription
  role: subscription term detail carrying its sales orders and quotes
  identifiers: [subscriptionId]
- name: SubscriptionUser
  role: an individual licence seat on a subscription
  identifiers: [subscriptionUserId, contactId]
  notable_fields: [licenceKey, approvalStatus, status, endDate]
- name: PaymentInformation
  role: collection wrapper for a scheme's commercial documents
  addressed_by: GET /api/Regulation/PaymentInformation
  notable_fields: [quotes, salesOrders, countOfQuotes, countOfSalesOrders, countOfSchemeAnnualReturns]
- name: RegulationQuote
  role: a priced quote for regulation or subscription fees
  identifiers: [quoteId, quoteRef]
  notable_fields: [totalAmount, taxAmount, discountAmount, isoCurrencyCode, paymentReceived, status, purchaseType]
- name: RegulationQuoteLine
  role: line item on a quote
- name: RegulationSalesOrder
  role: the order a quote converts into
  identifiers: [orderId, orderRef]
  notable_fields: [totalAmount, status, quoteNumber]
- name: PaymentRequestModel
  role: a payment request and its payer details
  addressed_by: GET /api/Payment/{id}, GET /api/Payment/{id}/reference/{reference}
  identifiers: [contactNo, reference, formattedReference, mid]
  notable_fields: [currency, currencyCode, paymentFees, canPayByIvr, isTest]
- name: Fees
  role: fee breakdown carried on a payment request
- name: ProfileModel
  role: an individual RICS member or applicant
  addressed_by: GET /api/Profile/{id}
  identifiers: [contactId, contactNo]
  notable_fields: [professionalGrade, designation, applicantType, worldRegion, region, country]
- name: SurveyWriterModel
  role: a survey-writing software licence check
  addressed_by: GET /api/SurveyWriter/{id}
  identifiers: [licenceKey]
  notable_fields: [isValid, organisation, productType, productCode, startDate, endDate]
- name: RegulationDeclaration
  role: pointer to a declaration document held in Azure blob/SharePoint storage
  identifiers: [rowKey, schemeId]
  notable_fields: [storageUrl, sharepointPath]
- name: Address
  role: postal address on an Office
- name: ProblemDetails
  role: error envelope (see errors/rics-problem-types.yml)
