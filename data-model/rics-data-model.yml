identifier_conventions:
  contactNo: >-
    The RICS member/contact number. It is the join key across ProfileModel, RegulationScheme
    (licencedContactNumber, submittedByContactNumber, contactOfficerNumber,
    responsiblePrincipalNumber), SubscriptionUser and PaymentRequestModel, and it is the same value
    the Azure AD B2C sign-in exposes as the non-standard contactNumber claim.
  regulatedSchemeNumber: the firm-facing regulation scheme number, the path key on GET /api/Regulation/{schemeNumber}
  licenceKey: appears on both SubscriptionUser and SurveyWriterModel - the seat key a partner product validates
  no_prefixes: RICS uses no Stripe-style typed id prefixes; identifiers are bare GUIDs or numbers
enum_lookups: [AddressType, CancellationReason, CurrentApplicationType, EndDateChangeReason, FirmRegsRoute, Gima, InclusionReason, LicenceEndReason, MemberDesignation, MemberPiiAndAdrRoute, PortalLocation, ProfessionalGrade, PurchaseType, QuoteStatus, RegulatedOrganisationType, RegulatoryType, ReturnStatusCode, SalesOrderStatus, SchemeLicenceStatus, SchemeLicenceStatusReason, SchemeLicenceType, ScoreResult, SponsorshipCode, SponsorshipCodeStatus, SubscriptionOwnerStatus, SubscriptionPaymentMethod, SubscriptionUserApprovalStatus, SubscriptionUserStatus, SuspensionReason]
notes:
  pii: >-
    ProfileModel carries direct personal data (name, preferred email, business and mobile phone,
    job title, country) and RegulationScheme carries named individuals. This is a personal-data API
    under UK GDPR, which is consistent with it being closed and credential-gated.
  separate_standard: >-
    This is NOT the RICS Data Standard. RDS 3.3.3 (openapi/rics-data-standard-3.3.3-schema.json) is
    an entirely separate, MIT-licensed land/property/infrastructure asset model with no overlap with
    the regulation entities above - RICS ships two unconnected data models.
