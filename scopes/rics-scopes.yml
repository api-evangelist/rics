notes:
  api_scopes: >-
    None. The DigitalCommunity API declares one securityScheme of type apiKey (Authorization header,
    bearer JWT). No scope, permission or role is published, so an integrator cannot reason about
    least privilege before receiving credentials from RICS.
  contactNumber_claim: >-
    The non-standard contactNumber claim is the RICS member/contact number, the same identifier the
    DigitalCommunity API surfaces as contactNo on ProfileModel - the one visible join between the
    member identity layer and the API data layer.
