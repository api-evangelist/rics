summary: >-
  RICS exposes exactly one OAuth/OIDC surface, and it is not the API. The Azure AD B2C tenant behind
  RICS member sign-in publishes an OIDC discovery document whose scopes_supported list contains a
  single value, "openid" - there is no resource scope, no API scope and no consent surface for
  third-party applications. The DigitalCommunity API at api.rics.org has no scope model at all: it
  authenticates with a RICS-issued username and password exchanged at POST /token for a bearer JWT,
  and entitlement is decided server-side and surfaced only as 403 Forbidden.
applies_to: RICS member sign-in (website and member portal), not api.rics.org
