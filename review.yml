sources:
  - url: https://api.rics.org/swagger/v1/swagger.json
    type: OpenAPI
    note: The only RICS-operated API contract found. Source of the "issued a username and password by RICS" access statement.
  - url: https://api.rics.org/
    type: APIReference
    note: Public Swagger UI, configuration names the spec "DigitalCommunity API V1" and sets tryItOutEnabled false.
  - url: https://github.com/RICS-Data-Standard/RDS
    type: SourceCode
    note: Canonical, MIT-licensed home of the RICS Data Standard schemas and examples.
  - url: https://www.rics.org/profession-standards/rics-standards-and-guidance/sector-standards/construction-standards/rics-data-standards
    type: Documentation
    note: RICS Data Standards landing page (content not retrievable anonymously behind Incapsula).
  - url: https://www.rics.org/get-involved/rics-tech-partner-programme
    type: Partners
    note: The only published route into a RICS technology relationship; a curated partner network, not a developer signup.
  - url: https://b2clogin.rics.org/ricsb2clive.onmicrosoft.com/B2C_1A_RICS_signup_signin/v2.0/.well-known/openid-configuration
    type: Authentication
    note: Confirms Azure AD B2C as the member identity layer; scopes_supported is ['openid'] only.
  - url: https://www.ricsfirms.com/
    type: Directory
    note: Public Find a Surveyor directory of RICS-regulated firms; Umbraco CMS internals only, no published API.

conclusion: >-
  RICS is the counter-example to RESO in this study. Where RESO publishes a mandated, certified,
  machine-readable contract that no developer can actually call, RICS publishes an unmandated,
  uncertified contract that anyone can download and nobody has to implement - the MIT-licensed RICS
  Data Standard - and separately runs one real API whose contract is fully public while its
  credentials are not. The United Kingdom has no MLS, so RESO is absent rather than unreachable:
  no certification, no OData, no $metadata, no UPI. RICS is a professional and valuation standards
  body, and its only production API governs regulation, insurance declarations, redress,
  subscriptions, payments and survey-writer integration - never listings, never valuations, never
  property records. Two facts held apart: the OpenAPI 3.0.1 document at api.rics.org is genuinely
  public and anonymously downloadable, and calling the API behind it requires a username and
  password issued by RICS with no published way to ask for one. Open data in this market comes from
  HM Land Registry and Ordnance Survey, not from the professional body.
