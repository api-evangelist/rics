openapi: 3.2.0
info:
  title: DigitalCommunity Survey Writer API
  description: To use this API, you need to have been first been issued a username and password by RICS.
  version: v1
security:
- Bearer: []
tags:
- name: SurveyWriter
paths:
  /api/SurveyWriter/{id}:
    get:
      tags:
      - SurveyWriter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyWriterModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      summary: Get api survey writer by id
      x-summary-source: derived
      operationId: getApiSurveyWriterById
      x-operation-id-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    SurveyWriterModel:
      type: object
      properties:
        isValid:
          type: boolean
        licenceKey:
          type:
          - string
          - 'null'
        organisation:
          type:
          - string
          - 'null'
        productType:
          type:
          - string
          - 'null'
        productCode:
          type:
          - string
          - 'null'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please enter into field the word 'Bearer' following by space and JWT
      name: Authorization
      in: header
