        schema:
          type: string
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: true
      summary: Create api azure storage upload file
      x-summary-source: derived
      operationId: postApiAzureStorageUploadFile
      x-operation-id-source: derived
  /api/AzureStorage/DownloadFile:
    get:
      tags:
      - AzureStorage
      parameters:
      - name: fileUrl
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: true
