  /api/AzureStorage/DeleteLogData:
    post:
      tags:
      - AzureStorage
      parameters:
      - name: tableName
        in: query
        schema:
          type: string
      - name: toDate
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: true
      summary: Create api azure storage delete log data
      x-summary-source: derived
      operationId: postApiAzureStorageDeleteLogData
      x-operation-id-source: derived
components:
  schemas:
    RegulationDeclaration:
      type: object
      properties:
        rowKey:
          type:
          - string
          - 'null'
        schemeId:
          type:
          - string
          - 'null'
        storageUrl:
          type:
          - string
          - 'null'
        sharepointPath:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please enter into field the word 'Bearer' following by space and JWT
      name: Authorization
      in: header
