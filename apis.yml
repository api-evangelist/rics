apis:
- aid: rics:rics-digitalcommunity-api
  name: RICS DigitalCommunity API
  description: >-
    The RICS DigitalCommunity API is a live, RICS-operated REST API served from api.rics.org whose
    OpenAPI 3.0.1 contract is published anonymously and without credentials at
    https://api.rics.org/swagger/v1/swagger.json (HTTP 200, 67,992 bytes, fetched 2026-07-26) and
    rendered in a Swagger UI at https://api.rics.org/. It carries 16 operations across seven tags -
    Token, Profile, Regulation, Payment, SurveyWriter, AzureStorage and OlaMerchantPost - and its
    schemas are unmistakably those of a professional regulator: RegulationScheme, SchemeLicenceType,
    SchemeLicenceStatus, PiiInsurer, RedressProvider, MemberDesignation, ProfessionalGrade,
    RegulatedOrganisationType, SurveyingService, SurveyWriterModel, RegulationSubscription and
    RegulationQuote. This is the machinery behind RICS firm regulation, professional indemnity
    insurance and redress declarations, subscription billing and survey-writing software
    integration - it is NOT a property, listings or valuation-data API. Access is not self-serve.
    The specification's own info.description states that "to use this API, you need to have been
    first been issued a username and password by RICS", which are POSTed as a JSON User object to
    /token to receive a short-lived bearer JWT that must accompany every subsequent request. No
    application form, pricing page, terms page or developer documentation for this API was found on
    any RICS property; the closest published route is the RICS Tech Partner Programme. Probed
    anonymously on 2026-07-26, GET /api/Profile/1 returned HTTP 401 and GET /token returned HTTP 405,
    confirming the surface is live and enforcing authentication.
  humanURL: https://api.rics.org/
  baseURL: https://api.rics.org
