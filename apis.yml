aid: rics
url: https://raw.githubusercontent.com/api-evangelist/rics/refs/heads/main/apis.yml
name: RICS (Royal Institution of Chartered Surveyors)
kind: company
description: >-
  RICS, the Royal Institution of Chartered Surveyors, is the British royal-chartered professional
  body founded in London in 1868 that qualifies, regulates and sets standards for surveyors,
  valuers and built-environment professionals worldwide, with the United Kingdom as its home
  market. In the property value chain it sits on the professional and valuation side rather than
  the listings side: it writes the RICS Valuation - Global Standards (the Red Book, incorporating
  IVS), the RICS Home Survey Standard, RICS Property Measurement / IPMS, ICMS, ILMS and the Rules
  of Conduct, it regulates roughly 12,000 RICS-regulated firms, and it runs the consumer-facing
  Find a Surveyor directory at ricsfirms.com and the isurv knowledge platform. Because the United
  Kingdom has no MLS, there is no RESO here at all - no RESO Web API or Data Dictionary
  certification, no OData $metadata, no Universal Property Identifier - so the "certified but
  unreachable" pattern does not apply; there is simply no listing-data certification layer in this
  market. What RICS does publish is genuinely machine-readable: the RICS Data Standard (RDS) 3.3.3
  is an MIT-licensed JSON Schema and XSD covering land, property and infrastructure assets and
  incorporating ICMS, ILMS, IPMS, IVS and IBOS, hosted openly on GitHub at RICS-Data-Standard/RDS
  and downloadable anonymously. RICS also operates one real production API - the DigitalCommunity
  API at api.rics.org, whose OpenAPI 3.0.1 contract is served publicly and anonymously from a live
  Swagger UI - but it is not a public data API: it exposes RICS firm regulation schemes, PII and
  redress records, subscriptions, payments, member profiles and survey-writer integration, and its
  own description states that credentials must first be issued by RICS. There is no developer
  portal, no self-serve signup, and no open dataset from RICS; the UK's open property data layer
  belongs to HM Land Registry and Ordnance Survey, not to the professional body.
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.
