  versioning:
    scheme: none-in-path
    current: v1
    evidence: >-
      info.version = "v1"; document served at /swagger/v1/swagger.json; operation paths themselves
      are unversioned (/api/Profile/{id}, /token).
    docs: none
  deprecation:
