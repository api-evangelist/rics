summary: >-
  RICS runs two independently versioned things and neither carries a published lifecycle policy for
  integrators. The DigitalCommunity API is on an unversioned "v1" with no deprecation policy, no
  Sunset/Deprecation header support, no SLA and no status page. The RICS Data Standard (RDS) is
  properly versioned and released on GitHub - v3.3.3 (March 2022) superseding v3.2.1 (April 2021) -
  but it has had no release in over four years and its repository last saw a push in January 2025.
